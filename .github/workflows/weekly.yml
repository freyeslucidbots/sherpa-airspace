# Compiles the FAA airspace snapshot every Monday and publishes it as a
# GitHub release. The controller app polls the latest release (weekly, when
# it has internet) and downloads the assets when the tag changes.
name: Weekly airspace snapshot

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC (~04:00 Charlotte)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airspace-snapshot
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compile FAA data
        run: python3 compile.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="airspace-$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['version'])")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; replacing assets"
            gh release upload "$TAG" dist/manifest.json dist/uasfm.bin.gz dist/restrictions.geojson --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/manifest.json dist/uasfm.bin.gz dist/restrictions.geojson \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Weekly FAA airspace snapshot (UAS facility map ceilings, national-security and prohibited areas). Advisory only; TFRs are fetched live by the app."
          fi
